name: Build Catatan Utama APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "patch/**"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and patch
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract base project
        run: mkdir -p source && tar -xzf Catatan-Utama-Source.tar.gz -C source

      - name: Apply compatibility-first widget
        run: |
          set -euo pipefail
          PROJECT="source/catatan-utama"
          cp patch/app/build.gradle.kts "$PROJECT/app/build.gradle.kts"
          cp patch/app/src/main/AndroidManifest.xml "$PROJECT/app/src/main/AndroidManifest.xml"
          mkdir -p "$PROJECT/app/src/main/java/id/yoga/catatanutama/widget"
          cp patch/app/src/main/java/id/yoga/catatanutama/widget/*.kt "$PROJECT/app/src/main/java/id/yoga/catatanutama/widget/"
          mkdir -p "$PROJECT/app/src/main/res/layout" "$PROJECT/app/src/main/res/xml" "$PROJECT/app/src/main/res/values"
          cp patch/app/src/main/res/layout/widget_note_paged.xml "$PROJECT/app/src/main/res/layout/"
          cp patch/app/src/main/res/xml/note_widget_info.xml "$PROJECT/app/src/main/res/xml/"
          cp patch/app/src/main/res/values/strings.xml "$PROJECT/app/src/main/res/values/"
          mkdir -p "$PROJECT/app/src/test/java/id/yoga/catatanutama/widget"
          cp patch/app/src/test/java/id/yoga/catatanutama/widget/*.kt "$PROJECT/app/src/test/java/id/yoga/catatanutama/widget/"

      - name: Run pager tests and build APK
        working-directory: source/catatan-utama
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK and record signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="source/catatan-utama/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/catatan-utama"
          cp "$APK" "$RUNNER_TEMP/catatan-utama/Catatan-Utama-Stabil.apk"
          cat > "$RUNNER_TEMP/catatan-utama/build-info.txt" <<EOF
          Application ID: id.yoga.catatanutama.stable
          Version: 1.0.2
          Version code: 1
          APK SHA-256: $APK_SHA
          Signing certificate SHA-256: $CERT_SHA
          Git commit: $GITHUB_SHA
          Widget: TextView-only paged RemoteViews; no collection adapter
          EOF

      - name: Upload APK and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-UTAMA-STABIL-APK
          path: ${{ runner.temp }}/catatan-utama/*
          if-no-files-found: error
          retention-days: 30
