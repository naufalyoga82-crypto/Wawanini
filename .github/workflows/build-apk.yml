name: Build Catatan Utama APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Catatan-Utama-Source.tar.gz"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Android project
        run: mkdir -p source && tar -xzf Catatan-Utama-Source.tar.gz -C source

      - name: Build debug APK
        working-directory: source/catatan-utama
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-UTAMA-DEBUG-APK
          path: source/catatan-utama/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
